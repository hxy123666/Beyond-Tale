<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="Shortcut Icon" href="../../../assets/ico/ico.webp">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyond Tale</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============ 横屏提示样式 ============ */
    @media screen and (orientation: portrait) {
      body::before {
        content: "请将手机横屏以获得最佳游戏体验";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: 'Press Start 2P', monospace;
        font-size: 16px;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        max-width: 300px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      }
      
      /* 只模糊游戏画布，不影响UI元素 */
      #gameCanvas,
      #loadingScreen {
        filter: blur(5px);
        pointer-events: none;
      }
      
      /* 确保重要UI元素在竖屏时仍然可见和可交互 */
      #escMenu,
      #achievementPopup,
      .achievement-popup,
      #npcDialog {
        filter: none !important;
        pointer-events: auto !important;
        z-index: 10001 !important;
      }
      
      /* 确保成就弹窗在移动端可见 */
      .popup-content {
        background: rgba(50, 50, 50, 0.95) !important;
        border: 2px solid #FFD700 !important;
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.8) !important;
      }
    }

    /* ============ NPC 对话弹窗样式 ============ */
    #npcDialog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      /* 建议全黑，不透明 */
      z-index: 9999;
    }

    #npcDialog.hidden {
      display: none;
    }

    #dialogFrame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <!-- 加载界面 -->
  <iframe id="loadingScreen" src="../first stage/gap.html" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1000;"></iframe>
  
  <canvas id="gameCanvas" width="840" height="480" style="display: none;"></canvas>
  <!-- Canvas尺寸调整为 70 * 12 = 840, 20 * 12 = 240，为了演示方便，这里扩大了一倍 -->
  <!-- 背景音乐 -->
  <audio src="../music/蔚蓝bgm.mp3" id="dd" loop="loop"></audio>
  <!-- Esc菜单 - 默认隐藏 -->
  <div id="escMenu" class="hidden">
    <div class="menu-content">
      <button id="continueBtn">Continue</button>
      <button id="saveBtn">Save</button>
      <button id="mainMenuBtn">Return to Main Menu</button>
    </div>
  </div>
  <!-- 成就弹窗 -->
  <div id="achievementPopup" class="hidden">
    <div class="popup-content">
      <h2 id="achievementTitle">Unlock achievement</h2>
      <p id="achievementDescription"></p>
    </div>
  </div>
  <!-- NPC 对话全屏窗口 -->
  <div id="npcDialog" class="hidden">
    <iframe id="dialogFrame" src="#" frameborder="0" tabindex="-1"></iframe>
  </div>
  <script src="gameState.js"></script>
  <script src="../../../script/achievement.js"></script>
  <script src="script1.js"></script>
  <!--一定要先导入scriptn(n为数字).js再导入script.js,否则地图无法加载！-->
  <script src="script.js"></script>
  <script src="../mobile-controller.js"></script>
  <script src="../../../script/save.js"></script>
  <script src="../../../script/Esc.js"></script>
</body>

</html>
